name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 防止 pip/构建/部署挂起耗尽运行时长
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git 插件需要完整历史（git-revision-date / git-authors）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pin 具体版本，保证构建可复现
          cache: pip       # 缓存 pip 依赖，加速构建
      - run: pip install --no-cache-dir -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'   # PR 仅做构建校验，不部署
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push'
