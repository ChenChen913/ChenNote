name: ci
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 防止 pip/构建/部署挂起耗尽运行时长
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git 插件需要完整历史（git-revision-date / git-authors）
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip       # 缓存 pip 依赖，加速构建
      - run: pip install -r requirements.txt
      - run: mkdocs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
